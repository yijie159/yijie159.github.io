# Netlify 部署配置
# 环境变量（Site settings → Environment variables）中必须设置：
#   DEEPSEEK_API_KEY = 你的 DeepSeek API Key（platform.deepseek.com 申请）

[build]
    command = "npm run build"
    publish = "public"

[build.environment]
    NODE_VERSION = "20.19.0"

[functions]
    directory = "netlify/functions"

# 把 /api/chat 重写到 DeepSeek 代理函数
[[redirects]]
    from = "/api/chat"
    to = "/.netlify/functions/chat"
    status = 200
    force = true
