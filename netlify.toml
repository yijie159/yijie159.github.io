# Netlify 部署配置
# 环境变量（Site settings → Environment variables）中必须设置：
#   DEEPSEEK_API_KEY = 你的 DeepSeek API Key（platform.deepseek.com 申请）

[build]
    # 每次部署强制 clean + 全量重建：
    # 确保 ai-blog-index.json（AI 助手知识库）随新文章同步重新生成，不会沿用旧缓存
    command = "npm run netlify"
    publish = "public"

[build.environment]
    NODE_VERSION = "20.19.0"

[functions]
    directory = "netlify/functions"

# 把 /api/chat 重写到 DeepSeek 代理函数
[[redirects]]
    from = "/api/chat"
    to = "/.netlify/functions/chat"
    status = 200
    force = true
